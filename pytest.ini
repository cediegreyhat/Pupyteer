[pytest]
asyncio_mode = auto
# Pin the loop scope explicitly: the unset default is deprecated and pytest
# prints a warning on every run, which is noise on top of noise.
asyncio_default_fixture_loop_scope = function
# Quiet by default: a full run is ~1500 tests and the progress dots plus the
# header are more output than someone reading a green/red result needs. Pass
# -v when the detail is what you want; the last flag wins.
addopts = -q --no-header -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:pupyteer\.server\.transports\.listener
