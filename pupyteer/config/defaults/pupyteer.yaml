# Pupyteer Default Configuration
# Copy to ~/.config/pupyteer/config.yaml or ./pupyteer.yaml

server:
  host: "0.0.0.0"
  port: 8443
  backlog: 10
  # HTTP(S) callbacks carry the same session protocol as TCP, one message per
  # POST. Left disabled because 8080 is usually taken; set a port to serve
  # payloads built with --transport http/https.
  http_port: 0
  http_uri: "/index.html"
  # Callbacks over TLS, on by default: the session protocol is JSON, so without
  # it everything typed and everything returned is readable to whoever owns the
  # network. Payloads built while this is on pin the listener's own certificate,
  # which is the only check either side can make on a self-signed team server.
  # Set false to opt out deliberately — the build log and the listener both say
  # the channel is plaintext. Note that payloads built while this was false
  # cannot reach a listener that has it on; transports list counts those
  # handshakes as refused.
  tls: true
  tls_cert: "./data/tls/listener.crt"
  tls_key: "./data/tls/listener.key"
  # Names in the certificate besides server.host. Set them before the first
  # start: an existing certificate is reused, never rewritten.
  tls_hostnames: []
  # Alternative to tls_*: terminate TLS with a certificate you obtained (a
  # reverse proxy in front of the HTTP listener works too).
  https_cert: ""
  https_key: ""
  # Enrollment secret. The listener is a command channel: whoever registers a
  # session can run commands against the operator's own fs_put/exec path. TLS
  # proves the listener to the agent; this proves the agent to the listener.
  # The secret is generated on first start and baked into every payload built
  # afterwards, so it must be set before the first build of an engagement.
  agent_auth: true
  agent_auth_file: "./data/keys/enrollment.key"

logging:
  level: "INFO"
  format: "json"
  file: null  # or path to log file

# The audit trail is the record an engagement is judged on, so where it goes and
# how big it gets are configuration, not a surprise. It rotates by size or day,
# whichever comes first, and the rotated files are gzipped beside it.
audit:
  log_file: "./logs/audit.json"
  max_bytes: 10485760   # 10 MB
  backup_count: 5
  compress: true

operator:
  name: "redteam-operator"
  theme: "dark"

profile:
  default: "HTTPS-Standard"

session:
  timeout_seconds: 300

tasks:
  max_concurrent: 5

security:
  # The console needs a credential before any verb that touches a session, a
  # listener or an artifact. `false` makes whoever holds the keyboard an admin.
  require_auth: true
  token_ttl: 3600
  max_failed_logins: 5
  # A name unlocks by itself this long after the last miss.
  lockout_seconds: 300
  # Hashed credentials, written on first use and never here. With no such file a
  # server run generates one operator password and prints it once.
  operators_file: "./data/keys/operators.json"

paths:
  payload_artifacts: "./payloads/artifacts"
  profiles: "./config/profiles"
  logs: "./logs"

evasion:
  test_mode: false  # MUST be explicitly enabled for lab use
  history_path: "./logs/evasion_history.json"
  litterbox_url: ""  # e.g., http://localhost:8080
  litterbox_token: ""  # set via PUPYTEER_EVASION__LITTERBOX_TOKEN
  litterbox_timeout: 120
